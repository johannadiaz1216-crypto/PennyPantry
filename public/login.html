<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Penny Pantry</title>
  <meta name="description" content="Penny Pantry searches top grocery stores for the best price on every item in your cart, so you can compare and save." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23e8a33d'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Georgia' font-weight='700' fill='%231f3d2b'>¢</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try {
      var t = localStorage.getItem("pp-theme");
      if (t === "light" || t === "dark" || t === "pink") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="icon-pink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  </svg>
  <header class="site-header">
    <div class="container nav">
      <a href="/" class="brand" aria-label="Penny Pantry home">
        <span class="brand-mark" aria-hidden="true">¢</span>
        <span class="brand-name">Penny Pantry</span>
      </a>
      <div class="nav-actions">
        <div class="theme-picker">
          <button type="button" class="theme-toggle" id="theme-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" aria-label="Change theme">
            <svg class="icon" aria-hidden="true"><use href="#icon-system" id="theme-toggle-icon"></use></svg>
          </button>
          <ul class="theme-menu" id="theme-menu" role="menu" aria-label="Theme" hidden>
            <li role="none"><button type="button" role="menuitemradio" data-theme-option="system"><svg class="icon" aria-hidden="true"><use href="#icon-system"></use></svg>System</button></li>
            <li role="none"><button type="button" role="menuitemradio" data-theme-option="light"><svg class="icon" aria-hidden="true"><use href="#icon-light"></use></svg>Light</button></li>
            <li role="none"><button type="button" role="menuitemradio" data-theme-option="dark"><svg class="icon" aria-hidden="true"><use href="#icon-dark"></use></svg>Dark</button></li>
            <li role="none"><button type="button" role="menuitemradio" data-theme-option="pink"><svg class="icon" aria-hidden="true"><use href="#icon-pink"></use></svg>Pink</button></li>
          </ul>
        </div>
        <div class="account" id="account">
          <a href="login.html" class="nav-login" id="login-link" aria-current="page">Log in</a>
          <div class="account-signed-in" id="account-signed-in" hidden>
            <button type="button" class="account-toggle" id="account-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
              <span class="avatar" id="account-avatar" aria-hidden="true"></span>
              <span class="account-name" id="account-name"></span>
            </button>
            <div class="account-menu" id="account-menu" role="menu" hidden>
              <p class="account-menu-name" id="account-menu-name"></p>
              <p class="account-menu-email" id="account-menu-email"></p>
              <button type="button" role="menuitem" id="sign-out">Log out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <span class="brand-mark login-mark" aria-hidden="true">¢</span>
      <h1 id="login-title">Welcome to Penny Pantry</h1>

      <div id="login-signed-out">
        <p class="login-lede">Log in to save shopping lists and get price-drop alerts.</p>
        <button type="button" class="google-btn" id="google-login">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>
        <p class="login-status" id="login-status" role="status"></p>
      </div>

      <div id="login-signed-in" hidden>
        <span class="avatar avatar-lg" id="login-avatar" aria-hidden="true"></span>
        <p class="login-lede">You're logged in as <strong id="login-name"></strong>.</p>
        <a href="/" class="btn">Go to Penny Pantry</a>
      </div>

      <p class="login-fine">We only use your Google name, email and profile picture.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
</body>
</html>
